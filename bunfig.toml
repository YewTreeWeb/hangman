[serve.static]
plugins = ["bun-plugin-tailwind"]
env = "BUN_PUBLIC_*"

[lint]
# typeAware = true   # also run the rules that need types

[lint.rules]
# "no-console" = "warn"
# "eqeqeq" = ["error", "smart"]

[fmt]
# Vendored and generated files stay byte-identical to their source
ignorePatterns = ["tools/oxlint/anti-slop/", ".claude/skills/"]
sortImports = true
sortTailwindcss = true
sortPackageJson = true
